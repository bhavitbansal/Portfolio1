<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0" />

    <title>Bhavit Bansal | Experience</title>

    <link rel="stylesheet" href="intro.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.7/gsap.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.7/ScrollTrigger.min.js"></script>

</head>

<body>

    <!-- Virtual Scroll Area -->
    <div id="scroll-container">

        <!-- Pinned Intro -->
        <section id="intro-stage">

            <video
                id="intro-video"
                muted
                playsinline
                preload="auto"
                disablepictureinpicture
            >
                <source
                    src="intro.mp4"
                    type="video/mp4">
            </video>

            <!-- ===========================
                 INTRO OVERLAY (NEW)
            ============================ -->
            <div id="intro-ui">

                <h1>BHAVIT BANSAL</h1>

                <h2>SCROLL TO BEGIN</h2>

                <div class="mouse">
                    <div class="wheel"></div>
                </div>

                <div class="arrow">↓</div>

                <p>
                    For the smoothest experience,<br>
                    scroll gently.
                </p>

            </div>

            <!-- Fade Overlay -->
            <div id="fade-overlay"></div>

        </section>

    </div>

    <script src="intro.js"></script>

</body>

</html>
